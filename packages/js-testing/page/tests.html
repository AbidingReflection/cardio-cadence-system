<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>JavaScript Tests</title>

        <link rel="stylesheet" href="/packages/js-testing/page/tests.css" />
    </head>

    <body>
        <main class="test-page">
            <h1 id="test-page-title">JavaScript Tests</h1>

            <section aria-labelledby="test-summary-heading">
                <h2 id="test-summary-heading">Overall Summary</h2>

                <table class="test-summary" aria-label="Overall test summary">
                    <thead>
                        <tr>
                            <th>Status</th>
                            <th>Suites</th>
                            <th>Total</th>
                            <th>Passed</th>
                            <th>Failed</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td id="test-summary-status" class="test-status test-status--pending">
                                PENDING
                            </td>
                            <td id="test-summary-suites">0</td>
                            <td id="test-summary-total">0</td>
                            <td id="test-summary-passed">0</td>
                            <td id="test-summary-failed">0</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <section aria-labelledby="test-suite-summary-heading">
                <h2 id="test-suite-summary-heading">Suite Summary</h2>

                <table class="test-suite-summary" aria-label="Test suite summary">
                    <thead>
                        <tr>
                            <th aria-sort="none">
                                <button
                                    type="button"
                                    data-suite-sort-column="0"
                                    data-suite-sort-type="text"
                                >
                                    Suite
                                </button>
                            </th>
                            <th aria-sort="none">
                                <button
                                    type="button"
                                    data-suite-sort-column="1"
                                    data-suite-sort-type="text"
                                >
                                    Status
                                </button>
                            </th>
                            <th aria-sort="none">
                                <button
                                    type="button"
                                    data-suite-sort-column="2"
                                    data-suite-sort-type="number"
                                >
                                    Total
                                </button>
                            </th>
                            <th aria-sort="none">
                                <button
                                    type="button"
                                    data-suite-sort-column="3"
                                    data-suite-sort-type="number"
                                >
                                    Passed
                                </button>
                            </th>
                            <th aria-sort="none">
                                <button
                                    type="button"
                                    data-suite-sort-column="4"
                                    data-suite-sort-type="number"
                                >
                                    Failed
                                </button>
                            </th>
                        </tr>
                    </thead>

                    <tbody id="test-suite-summary"></tbody>
                </table>
            </section>

            <div id="test-suites"></div>
        </main>

        <script type="module" src="/packages/js-testing/page/test-page.js"></script>
    </body>
</html>
