<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadence Controller</title>

    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/playback.css" />
    <link rel="stylesheet" href="./css/workout-status.css" />
  </head>

  <body>
    <main class="cadence-controller">
      <section class="controller-display">
        <section class="cadence-pane" aria-labelledby="cadence-heading">
          <h2 id="cadence-heading" class="visually-hidden">Cadence Guidance</h2>

          <div
            id="cadence-visualizer"
            class="cadence-visualizer"
            aria-label="Cadence guidance"
          ></div>

          <div class="load-display">
            <span class="load-display__label"> </span>

            <span id="resistance-value" class="load-display__value"> — </span>
          </div>
        </section>

        <section class="workout-status" aria-labelledby="protocol-title">
          <header class="workout-status__header">
            <div>
              <p class="controller-header__app-name">Cadence Controller</p>

              <h1 id="protocol-title" class="controller-header__protocol-title">
                Loading protocol...
              </h1>
            </div>

            <div id="playback-state" class="playback-state" aria-live="polite">
              Idle
            </div>
          </header>

          <div
            id="countdown"
            class="playback-countdown"
            aria-live="polite"
          ></div>

          <div class="workout-status__primary">
            <div class="workout-status__metric">
              <span class="workout-status__label"> Current Phase </span>

              <span id="current-phase" class="workout-status__value"> — </span>
            </div>

            <div class="workout-status__metric">
              <span class="workout-status__label"> Phase Remaining </span>

              <span
                id="phase-remaining-time"
                class="workout-status__value workout-status__value--time"
              >
                —
              </span>
            </div>

            <div class="workout-status__metric">
              <span class="workout-status__label"> Current Block </span>

              <span id="current-block" class="workout-status__value"> — </span>
            </div>
          </div>

          <div class="workout-status__upcoming">
            <div class="workout-status__metric">
              <span class="workout-status__label"> Next Phase </span>

              <span id="next-phase" class="workout-status__value"> — </span>
            </div>

            <div class="workout-status__metric">
              <span class="workout-status__label"> Next Block </span>

              <span id="next-block" class="workout-status__value"> — </span>
            </div>
          </div>

          <div class="workout-status__time">
            <div class="workout-status__metric">
              <span class="workout-status__label"> Elapsed </span>

              <span
                id="elapsed-time"
                class="workout-status__value workout-status__value--time"
              >
                0:00
              </span>
            </div>

            <div class="workout-status__metric">
              <span class="workout-status__label"> Workout Remaining </span>

              <span
                id="remaining-time"
                class="workout-status__value workout-status__value--time"
              >
                0:00
              </span>
            </div>
          </div>
        </section>
      </section>

      <section class="playback-controls" aria-label="Playback controls">
        <button id="start-button" type="button" class="playback-control">
          Start
        </button>

        <button
          id="pause-button"
          type="button"
          class="playback-control"
          disabled
        >
          Pause
        </button>

        <button
          id="resume-button"
          type="button"
          class="playback-control"
          disabled
        >
          Resume
        </button>

        <button
          id="stop-button"
          type="button"
          class="playback-control"
          disabled
        >
          Stop
        </button>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
