<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Cardio Cadence Protocol Designer</title>

        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/pane.css" />
        <link rel="stylesheet" href="css/top-ribbon.css" />
        <link rel="stylesheet" href="css/graph-pane.css" />
        <link rel="stylesheet" href="css/graph.css" />
        <link rel="stylesheet" href="css/protocol-pane.css" />
        <link rel="stylesheet" href="css/protocol-tree.css" />
        <link rel="stylesheet" href="css/totals-ribbon.css" />
    </head>

    <body>
        <header class="top-ribbon">
            <div class="app-brand">
                <span class="app-brand__title"> Cardio Cadence </span>

                <span class="app-brand__section"> Protocol Designer </span>
            </div>

            <nav class="top-ribbon__menu" aria-label="Application menu">
                <button type="button" class="menu-button">New</button>

                <button type="button" class="menu-button">Import</button>
            </nav>
        </header>

        <main class="workspace">
            <section class="pane-layout" aria-label="Protocol designer workspace">
                <section class="pane protocol-pane">
                    <header class="pane__header protocol-pane__header">
                        <span class="protocol-pane__title">Protocol</span>

                        <div class="protocol-pane__actions">
                            <button
                                type="button"
                                class="protocol-pane__action-button"
                                id="manage-phases-button"
                                aria-label="Edit phases"
                                aria-pressed="false"
                            >
                                <span>Manage <u>P</u>hases</span>
                            </button>

                            <button
                                type="button"
                                class="protocol-pane__action-button"
                                id="manage-blocks-button"
                                aria-label="Edit blocks"
                                aria-pressed="false"
                            >
                                <span>Manage <u>B</u>locks</span>
                            </button>
                        </div>
                    </header>

                    <div class="pane__content protocol-content" id="protocol-content">
                        <div class="protocol-tree" id="protocol-tree"></div>
                    </div>
                </section>
                <style>
                    .graph-pane__content {
                        position: relative;
                        padding: 0;
                        overflow: hidden;
                    }

                    .graph-pane__content svg {
                        position: absolute;
                        inset: 0;

                        display: block;
                        width: 100%;
                        height: 100%;
                    }
                </style>

                <div class="graph-stack">
                    <section class="pane graph-pane graph-pane--cadence">
                        <header class="pane__header">Cadence</header>

                        <div class="pane__content graph-pane__content" id="cadence-graph"></div>
                    </section>

                    <section class="pane graph-pane graph-pane--load">
                        <header class="pane__header">Load</header>

                        <div class="pane__content graph-pane__content" id="load-graph"></div>
                    </section>
                </div>
            </section>
        </main>

        <aside class="totals-ribbon" aria-label="Protocol totals">
            <div class="total">
                <span class="total__label">Duration</span>
                <span class="total__value">00:00</span>
            </div>

            <div class="total">
                <span class="total__label">Machine Calorie Estimate</span>
                <span class="total__value">0 kCal</span>
            </div>
        </aside>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
