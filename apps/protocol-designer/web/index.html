<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cardio Cadence Protocol Designer</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/pane.css">
    <link rel="stylesheet" href="css/top-ribbon.css">
    <link rel="stylesheet" href="css/graph-pane.css">
    <link rel="stylesheet" href="css/protocol-pane.css">
    <link rel="stylesheet" href="css/protocol-tree.css">
    <link rel="stylesheet" href="css/totals-ribbon.css">
</head>

<body>
    <header class="top-ribbon">
        <div class="app-brand">
            <span class="app-brand__title">
                Cardio Cadence
            </span>

            <span class="app-brand__section">
                Protocol Designer
            </span>
        </div>

        <nav class="top-ribbon__menu" aria-label="Application menu">
            <button type="button" class="menu-button">
                New
            </button>

            <button type="button" class="menu-button">
                Import
            </button>
        </nav>
    </header>

    <main class="workspace">
        <section class="pane-layout" aria-label="Protocol designer workspace">
            <section class="pane protocol-pane">
                <header class="pane__header protocol-pane__header">
                    <span class="protocol-pane__title">Protocol</span>

                    <div class="protocol-pane__actions">
                        <button
                            type="button"
                            class="protocol-pane__action-button"
                            id="edit-phases-button"
                            aria-label="Edit phases"
                            aria-pressed="false"
                        >
                            <span>Edit Phases</span>
                        </button>

                        <button
                            type="button"
                            class="protocol-pane__action-button"
                            id="edit-blocks-button"
                            aria-label="Edit blocks"
                            aria-pressed="false"
                        >
                            <span>Edit Blocks</span>
                        </button>
                    </div>
                </header>

                <div
                    class="pane__content protocol-content"
                    id="protocol-content"
                >
                    <div
                        class="protocol-tree"
                        id="protocol-tree"
                    ></div>
                </div>
            </section>

            <div class="graph-stack">
                <section class="pane graph-pane graph-pane--cumulative-calories">
                    <header class="pane__header">
                        Cumulative Calorie Graph
                    </header>

                    <div class="pane__content" id="cumulative-graph">
                        <p>Cumulative SVG Graph will go here.</p>
                    </div>
                </section>

                <section class="pane graph-pane graph-pane--instantaneous-calories">
                    <header class="pane__header">
                        Instantaneous Calorie Graph
                    </header>

                    <div class="pane__content" id="instantaneous-graph">
                        <p>Instantaneous SVG Graph will go here.</p>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <aside class="totals-ribbon" aria-label="Protocol totals">
        <div class="total">
            <span class="total__label">Duration</span>
            <span class="total__value">00:00</span>
        </div>

        <div class="total">
            <span class="total__label">Machine Calorie Estimate</span>
            <span class="total__value">0 kCal</span>
        </div>
    </aside>

    <script type="module" src="js/app.js"></script>
</body>
</html>
