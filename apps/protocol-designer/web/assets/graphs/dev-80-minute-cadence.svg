<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 240"
    preserveAspectRatio="none"
    role="img"
    aria-labelledby="cadence-title"
    >
    <title id="cadence-title">Cadence graph mock-up</title>

    <style>
        .graph-bg {
        fill: #f5f5f5;
        }

        .axis {
        stroke: #333;
        stroke-width: 2;
        }

        .tick {
        stroke: #333;
        stroke-width: 1.5;
        }

        .tick-label,
        .axis-label,
        .region-label,
        .phase-label {
        fill: #333;
        font-family: sans-serif;
        }

        .tick-label {
        font-size: 12px;
        }

        .axis-label {
        font-size: 13px;
        }

        .region-label {
        font-size: 12px;
        font-weight: 600;
        text-anchor: middle;
        }

        .phase-label {
        font-size: 12px;
        font-weight: 700;
        text-anchor: middle;
        }

        .phase-bar {
        stroke-width: 6;
        stroke-linecap: round;
        }

        .graph-block {
        cursor: pointer;
        }

        .graph-block .block-region {
        opacity: 0.45;
        transition:
        opacity 160ms ease,
        transform 160ms ease;
        transform-box: fill-box;
        transform-origin: center;
        }

        .graph-block .block-line {
        fill: none;
        stroke: #2563eb;
        stroke-width: 4;
        vector-effect: non-scaling-stroke;
        transition:
        stroke-width 160ms ease,
        transform 160ms ease;
        transform-box: fill-box;
        transform-origin: center;
        }

        .graph-block:hover .block-region {
        opacity: 0.75;
        transform: scaleY(1.03);
        }

        .graph-block:hover .block-line {
        stroke-width: 6;
        }

        .block-divider {
        stroke: rgba(255, 255, 255, 0.95);
        stroke-width: 2;
        }
    </style>

    <!-- Background -->
    <rect
        class="graph-bg"
        x="0"
        y="0"
        width="800"
        height="240"
        />

    <!-- Phase bars -->
    <g>
        <text class="phase-label" x="123.75" y="14">Warm-up</text>
        <line
            class="phase-bar"
            x1="60"
            y1="24"
            x2="187.5"
            y2="24"
            stroke="#86efac"
            />

        <text class="phase-label" x="400" y="14">Primary</text>
        <line
            class="phase-bar"
            x1="187.5"
            y1="24"
            x2="612.5"
            y2="24"
            stroke="#fcd34d"
            />

        <text class="phase-label" x="676.25" y="14">Cool-down</text>
        <line
            class="phase-bar"
            x1="612.5"
            y1="24"
            x2="740"
            y2="24"
            stroke="#93c5fd"
            />
        </g>

        <!-- Block regions -->
        <g class="graph-block graph-block--warmup">
            <rect
                class="block-region"
                x="60"
                y="40"
                width="127.5"
                height="150"
                fill="#bbf7d0"
                />
            <text class="region-label" x="123.75" y="56">Warm-up</text>

            <polyline
                class="block-line"
                points="
                60,160
                91.875,160 91.875,145
                123.75,145 123.75,130
                155.625,130 155.625,115
                187.5,115
                "
                />
            </g>

            <g class="graph-block graph-block--primary-1">
                <rect
                    class="block-region"
                    x="187.5"
                    y="40"
                    width="127.5"
                    height="150"
                    fill="#fde68a"
                    />
                <text class="region-label" x="251.25" y="56">60 RPM</text>

                <polyline
                    class="block-line"
                    points="
                    187.5,115
                    187.5,100
                    315,100
                    "
                    />
                </g>

                <g class="graph-block graph-block--primary-2">
                    <rect
                        class="block-region"
                        x="315"
                        y="40"
                        width="127.5"
                        height="150"
                        fill="#fde68a"
                        />
                    <text class="region-label" x="378.75" y="56">65 RPM</text>

                    <polyline
                        class="block-line"
                        points="
                        315,100
                        315,85
                        442.5,85
                        "
                        />
                    </g>

                    <g class="graph-block graph-block--primary-3">
                        <rect
                            class="block-region"
                            x="442.5"
                            y="40"
                            width="170"
                            height="150"
                            fill="#fde68a"
                            />
                        <text class="region-label" x="527.5" y="56">70 RPM</text>

                        <polyline
                            class="block-line"
                            points="
                            442.5,85
                            442.5,70
                            612.5,70
                            "
                            />
                        </g>

                        <g class="graph-block graph-block--cooldown">
                            <rect
                                class="block-region"
                                x="612.5"
                                y="40"
                                width="127.5"
                                height="150"
                                fill="#bfdbfe"
                                />
                            <text class="region-label" x="676.25" y="56">Cool-down</text>

                            <polyline
                                class="block-line"
                                points="
                                612.5,70
                                612.5,85
                                633.75,85 633.75,100
                                655,100 655,115
                                676.25,115 676.25,130
                                697.5,130 697.5,145
                                718.75,145 718.75,160
                                740,160
                                "
                                />
                            </g>

                            <!-- Block dividers -->
                            <line class="block-divider" x1="187.5" y1="40" x2="187.5" y2="190" />
                            <line class="block-divider" x1="315" y1="40" x2="315" y2="190" />
                            <line class="block-divider" x1="442.5" y1="40" x2="442.5" y2="190" />
                            <line class="block-divider" x1="612.5" y1="40" x2="612.5" y2="190" />

                            <!-- Axes -->
                            <line
                                class="axis"
                                x1="60"
                                y1="190"
                                x2="740"
                                y2="190"
                                />
                            <line
                                class="axis"
                                x1="60"
                                y1="40"
                                x2="60"
                                y2="190"
                                />

                            <!-- X-axis ticks and labels -->
                            <g class="tick-label" text-anchor="middle">
                                <line class="tick" x1="60"  y1="190" x2="60"  y2="196" />
                                <text x="60"  y="212">0</text>

                                <line class="tick" x1="145" y1="190" x2="145" y2="196" />
                                <text x="145" y="212">10</text>

                                <line class="tick" x1="230" y1="190" x2="230" y2="196" />
                                <text x="230" y="212">20</text>

                                <line class="tick" x1="315" y1="190" x2="315" y2="196" />
                                <text x="315" y="212">30</text>

                                <line class="tick" x1="400" y1="190" x2="400" y2="196" />
                                <text x="400" y="212">40</text>

                                <line class="tick" x1="485" y1="190" x2="485" y2="196" />
                                <text x="485" y="212">50</text>

                                <line class="tick" x1="570" y1="190" x2="570" y2="196" />
                                <text x="570" y="212">60</text>

                                <line class="tick" x1="655" y1="190" x2="655" y2="196" />
                                <text x="655" y="212">70</text>

                                <line class="tick" x1="740" y1="190" x2="740" y2="196" />
                                <text x="740" y="212">80</text>
                            </g>

                            <!-- Y-axis ticks and labels -->
                            <g class="tick-label" text-anchor="end">
                                <line class="tick" x1="54" y1="190" x2="60" y2="190" />
                                <text x="48" y="194">30</text>

                                <line class="tick" x1="54" y1="160" x2="60" y2="160" />
                                <text x="48" y="164">40</text>

                                <line class="tick" x1="54" y1="130" x2="60" y2="130" />
                                <text x="48" y="134">50</text>

                                <line class="tick" x1="54" y1="100" x2="60" y2="100" />
                                <text x="48" y="104">60</text>

                                <line class="tick" x1="54" y1="70" x2="60" y2="70" />
                                <text x="48" y="74">70</text>

                                <line class="tick" x1="54" y1="40" x2="60" y2="40" />
                                <text x="48" y="44">80</text>
                            </g>

                            <!-- Axis labels -->
                            <text
                                class="axis-label"
                                x="400"
                                y="232"
                                text-anchor="middle"
                                >
                                Time (min)
                            </text>

                            <text
                                class="axis-label"
                                x="18"
                                y="115"
                                text-anchor="middle"
                                transform="rotate(-90 18 115)"
                                >
                                Cadence (RPM)
                            </text>
                        </svg>
