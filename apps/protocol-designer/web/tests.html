<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Protocol Designer Tests</title>

    <link rel="stylesheet" href="/css/tests.css">
</head>

<body>
    <main class="test-page">
        <h1>Protocol Designer Tests</h1>

        <table class="test-summary" aria-label="Test summary">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Total</th>
                    <th>Passed</th>
                    <th>Failed</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td
                        id="test-summary-status"
                        class="test-status test-status--pending"
                    >
                        PENDING
                    </td>
                    <td id="test-summary-total">0</td>
                    <td id="test-summary-passed">0</td>
                    <td id="test-summary-failed">0</td>
                </tr>
            </tbody>
        </table>

        <div id="test-suites"></div>
    </main>

    <script type="module" src="/js/tests/test-runner.js"></script>
</body>
</html>
